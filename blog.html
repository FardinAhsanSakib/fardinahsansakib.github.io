<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Writing by Fardin Ahsan Sakib on large language models, AI safety, and agents.">

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="icon" type="image/png" sizes="48x48" href="images/favicon-48.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="blog-page">
    <header>
        <div class="nav-container">
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle mobile menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <nav id="main-nav">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/#publications">Publications</a></li>
                    <li><a href="/blog" class="active">Blog</a></li>
                    <li><a href="FardinAhsanSakibResume.pdf" target="_blank">CV</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container blog-main">
        <section class="section" id="blog">
            <h2>Blog</h2>
            <div class="blog-list">
                <!--
                To publish a post, copy this block above the empty state and remove the empty state:

                <article class="blog-post">
                    <span class="news-date">MM/YYYY</span>
                    <h3 class="blog-post-title"><a href="blog/your-post.html">Post title</a></h3>
                    <p class="blog-post-excerpt">One- or two-sentence summary.</p>
                </article>
                -->
                <div class="blog-empty">
                    <h3>Posts coming soon</h3>
                    <p>I'll be writing here about large language models, AI safety, and agents. In the meantime, see my <a href="/#publications">publications</a>.</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Fardin Ahsan Sakib. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('mobile-menu-btn');
            const nav = document.getElementById('main-nav');
            if (!btn || !nav) return;
            const close = () => {
                btn.classList.remove('active');
                nav.classList.remove('active');
                document.body.style.overflow = '';
            };
            btn.addEventListener('click', function() {
                btn.classList.toggle('active');
                nav.classList.toggle('active');
                document.body.style.overflow = nav.classList.contains('active') ? 'hidden' : '';
            });
            document.addEventListener('click', e => {
                if (!nav.contains(e.target) && !btn.contains(e.target)) close();
            });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
        });
    </script>
</body>
</html>
